services:
  postgres:
    image: postgres:17-alpine
    container_name: vpic-postgres
    environment:
      POSTGRES_DB: vpic
      POSTGRES_USER: vpic_user
      POSTGRES_PASSWORD: vpic_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpic_user -d vpic"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vpic-network

  db-init:
    image: postgres:17-alpine
    container_name: vpic-db-init
    environment:
      POSTGRES_DB: vpic
      POSTGRES_USER: vpic_user
      POSTGRES_PASSWORD: vpic_password
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    volumes:
      - ./backups:/backups
      - ./init-db.sh:/init-db.sh
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vpic-network
    command: ["/bin/sh", "-c", "apk add --no-cache wget unzip && cp /init-db.sh /tmp/init-db.sh && sed -i 's/\\r$//' /tmp/init-db.sh && chmod +x /tmp/init-db.sh && /tmp/init-db.sh"]
    restart: "no"

  vin-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vin-api
    environment:
      DATABASE_URL: postgresql://vpic_user:vpic_password@postgres:5432/vpic
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - vpic-network
    volumes:
      - ./app:/app

volumes:
  postgres_data:

networks:
  vpic-network:
    driver: bridge
